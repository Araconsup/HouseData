services:
  db:
    image: postgres:16-alpine
    container_name: housedata_db
    environment:
      POSTGRES_DB: housedata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d housedata"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: housedata_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: housedata_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 housedata.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
    environment:
      - DIVAR_API_KEY=${DIVAR_API_KEY:-}
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/housedata
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-insecure-prod-key-change-me}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=*
      - MOCK_DIVAR_API=${MOCK_DIVAR_API:-False}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: housedata_celery_worker
    command: celery -A housedata worker -l info -c 2
    environment:
      - DIVAR_API_KEY=${DIVAR_API_KEY:-}
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/housedata
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-insecure-prod-key-change-me}
      - DEBUG=False
      - MOCK_DIVAR_API=${MOCK_DIVAR_API:-False}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: housedata_celery_beat
    command: celery -A housedata beat -l info
    environment:
      - DIVAR_API_KEY=${DIVAR_API_KEY:-}
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/housedata
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-insecure-prod-key-change-me}
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: housedata_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
